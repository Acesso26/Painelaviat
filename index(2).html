<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Central Financeira — Dashboard Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070a14; --panel:#111a2e; --panel-2:#0f172a; --border:#1e2a45; --border-light:#2a3655; --text:#e2e8f0; --muted:#94a3b8; --muted-2:#64748b; --blue:#3b82f6; --red:#ef4444; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
  .topo-fixo{flex-shrink:0;background:rgba(7,10,20,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 10px 8px 10px}
  .header-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .brand h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
  .brand h2 i{width:26px;height:26px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:7px;font-style:normal;font-size:12px}
  #status{font-size:9px;color:var(--muted-2);background:var(--panel-2);border:1px solid var(--border);padding:4px 8px;border-radius:12px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bannerAlarme{display:none;background:linear-gradient(90deg,#7f1d1d,#991b1b);border:1px solid rgba(239,68,68,0.5);color:#fff;padding:7px 10px;border-radius:7px;margin-bottom:7px;font-size:11px;text-align:center;font-weight:700}
  /* CARDS - AUMENTADOS UM POUCO */
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent),var(--panel);
    border:1px solid var(--border);border-radius:10px;
    padding:9px 10px;height:62px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .card small{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:800;display:flex;align-items:center;gap:4px;margin-bottom:4px}
  .card b{font-size:16.5px;font-weight:800;line-height:1;color:#fff;letter-spacing:-0.3px}
  .card span{font-size:10px;color:var(--muted-2);margin-left:5px;font-weight:600}
  .card .linha{display:flex;align-items:baseline}
  .card:nth-child(1){border-left:2.5px solid #3b82f6}
  .card:nth-child(2){border-left:2.5px solid #ef4444}
  .card:nth-child(3){border-left:2.5px solid #22c55e}
  .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
  /* CONTROLES - AUMENTADOS */
  .controles{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:8px 8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  }
  .grupo{display:flex;align-items:center;gap:6px}
  .controles label{font-size:11px;color:var(--muted);font-weight:700}
  .controles input[type="number"]{
    background:var(--bg);color:#fff;border:1px solid var(--border-light);border-radius:7px;
    padding:7px 10px;width:92px;font-size:12.5px;font-weight:600;outline:none;
  }
  .controles input[type="number"]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
  .btn{border-radius:7px;padding:7px 12px;font-size:11.5px;font-weight:800;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.15s}
  .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(59,130,246,0.25)}
  .btn-ghost{background:#1a233a;color:#cbd5e1;border-color:var(--border-light);min-width:42px;justify-content:center}
  .btn-ghost:hover{background:#1e2e50;color:#fff}
  .btn-amber{background:rgba(245,158,11,0.15);color:#fbbf24;border-color:rgba(245,158,11,0.3)}
  .btn-danger-glow{background:#991b1b;color:#fff;border-color:#ef4444;display:none;animation:pulse 1s infinite}
  .pesquisa-box{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;margin-top:7px;display:flex;gap:8px;align-items:center;
  }
  .pesquisa-box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:12.5px}
  .pesquisa-box input::placeholder{color:#475569}
  .tabela-wrap{
    flex:1;overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    margin:8px 8px 8px 8px;
  }
  .tabela-wrap::-webkit-scrollbar{width:6px}
  .tabela-wrap::-webkit-scrollbar-thumb{background:#1e2a45;border-radius:10px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:#0f172a;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.6px;padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);z-index:2;font-weight:800}
  td{padding:10px 8px;border-bottom:1px solid rgba(26,35,58,0.7);font-size:12px;color:#e2e8f0}
  tr:hover{background:#141f36}
  td b{color:#fff;font-weight:700}
  tr.saldo-alto{background:rgba(239,68,68,0.08)!important}
  tr.saldo-critico{background:rgba(239,68,68,0.16)!important}
  tr.desmarcada{opacity:0.35}
  .badge-valor{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);padding:3px 8px;border-radius:12px;font-weight:800;font-size:11.5px;color:#fff}
  tr.saldo-alto .badge-valor{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.4);color:#fecaca}
  tr.saldo-critico .badge-valor{background:#ef4444;color:#fff;border-color:#ef4444;box-shadow:0 2px 8px rgba(239,68,68,0.3)}
  /* BOTÕES COPIAR E ELIMINAR - MAIORES E COM COR */
  .btn-copiar{
    font-size:11.5px;padding:7px 12px;border-radius:7px;
    border:1px solid #2563eb;background:#1d4ed8;color:#fff;
    cursor:pointer;font-weight:700;transition:.15s;min-width:58px;justify-content:center;display:inline-flex;align-items:center;gap:4px;
    box-shadow:0 2px 8px rgba(37,99,235,0.25);
  }
  .btn-copiar:hover{background:#1e40af;transform:translateY(-1px)}
  .btn-copiar:nth-child(2){background:#0f766e;border-color:#0f766e;box-shadow:0 2px 8px rgba(15,118,110,0.25)}
  .btn-copiar:nth-child(2):hover{background:#115e59}
  .btn-eliminar{
    font-size:11.5px;padding:7px 14px;border-radius:7px;
    border:1px solid #ef4444;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;
    cursor:pointer;font-weight:800;min-width:64px;justify-content:center;display:inline-flex;box-shadow:0 2px 10px rgba(239,68,68,0.3);
  }
  .btn-eliminar:hover{background:#ef4444;transform:translateY(-1px) scale(1.02)}
  #modalConfirm{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.85);backdrop-filter:blur(8px);z-index:9999;justify-content:center;align-items:center;padding:14px}
  #modalConfirm .box{background:var(--panel);border:1px solid var(--border-light);padding:18px;border-radius:12px;width:100%;max-width:320px;text-align:center}
  .toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;border:1px solid var(--border-light);font-size:12px;display:none;z-index:9999;max-width:360px;box-shadow:0 8px 20px rgba(0,0,0,0.4)}
  @media (max-width: 600px){
    .cards{gap:6px}
    .card{height:60px;padding:8px 9px}
    .card b{font-size:15px}
    .card small{font-size:8px}
    .card span{font-size:9px}
    #status{max-width:40%;font-size:8.5px}
    .controles{padding:6px;gap:6px}
    .grupo{gap:5px}
    .btn{padding:7px 10px;font-size:11px}
    .controles input[type="number"]{width:76px;padding:6px 8px;font-size:12px}
    .tabela-wrap{margin:6px}
    table, thead, tbody, th, tr, td{display:block;width:100%}
    thead{display:none}
    tr{border:1px solid var(--border);border-radius:10px;margin:7px;width:auto;padding:3px 0;background:var(--panel-2)!important;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
    td{border:none;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
    td::before{content:attr(data-label);color:var(--muted);font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
    td:nth-child(1){display:none}
    td:nth-child(6){flex-direction:column;border-top:1px dashed var(--border);margin-top:4px;padding-top:10px}
    td:nth-child(6)::before{display:none}
    .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .acoes .btn-eliminar{grid-column:1/-1}
    .btn-copiar,.btn-eliminar{padding:9px 12px;font-size:12px;width:100%;justify-content:center}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
</style>
</head>
<body>
<div class="topo-fixo">
  <div class="header-top">
    <div class="brand"><h2><i>◍</i> Central Financeira</h2></div>
    <div id="status">● Carregando...</div>
  </div>
  <div id="bannerAlarme"></div>
  <div class="cards">
    <div class="card"><small><span class="dot" style="background:#3b82f6"></span> Total Contas</small><div class="linha"><b id="totalContas">0</b><span id="mostrando">0 contas</span></div></div>
    <div class="card"><small><span class="dot" style="background:#ef4444"></span> Alertas Ativos</small><div class="linha"><b id="saldoAltoCount" style="color:#f87171">0</b><span id="limiteInfo">≥1000 KZ</span></div></div>
    <div class="card"><small><span class="dot" style="background:#22c55e"></span> Sincronização</small><div class="linha"><b id="timer">03:00</b><span id="autoInfo">Auto ON</span></div></div>
  </div>
  <div class="controles">
    <div class="grupo">
      <button class="btn btn-primary" onclick="carregar()">↻ Atualizar</button>
      <label>Limite:</label>
      <input type="number" id="limiteAlarme" value="1000" min="0" step="100">
      <span style="color:#64748b;font-size:11px;font-weight:600">KZ</span>
    </div>
    <div class="grupo">
      <button class="btn btn-ghost" onclick="setLimite(1000)">1K</button>
      <button class="btn btn-ghost" onclick="setLimite(2000)">2K</button>
      <button class="btn btn-ghost" onclick="setLimite(5000)">5K</button>
      <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="autoToggle" checked> Auto</label>
    </div>
    <div class="grupo" style="margin-left:auto">
      <button class="btn btn-amber" onclick="desmarcarVermelhos()">✓ Limpar</button>
      <button class="btn btn-ghost" onclick="resetDesmarcados()">↩</button>
      <button class="btn btn-danger-glow" id="btnParar" onclick="pararAlarme()">🔇 Parar</button>
    </div>
  </div>
  <div class="pesquisa-box"><span style="color:#475569">⌕</span><input type="text" id="pesquisa" placeholder="Filtrar contacto, saldo..." oninput="filtrar()"></div>
</div>
<div class="tabela-wrap" id="tabelaWrap">
  <table>
    <thead><tr><th>#</th><th>Contacto</th><th>Credencial</th><th>Saldo</th><th>Data</th><th>Ações</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
</div>
<div id="modalConfirm"><div class="box"><p id="modalText" style="color:#e2e8f0;font-size:13px;font-weight:600;margin-bottom:16px;line-height:1.4"></p><div style="display:flex;gap:8px"><button id="modalCancel" class="btn btn-ghost" style="flex:1;padding:10px">Cancelar</button><button id="modalOk" class="btn" style="flex:1;padding:10px;background:#ef4444;color:#fff">Remover</button></div></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabaseUrl='https://ditnnbdjgefyqlgttolj.supabase.co'
const supabaseKey='sb_publishable_MoN-opvNr3QJ1TBLhwURtw_G1j9O_xn'
const supabase=createClient(supabaseUrl,supabaseKey)
let todosDados=[], dadosFiltrados=[], alarmeAtivo=false, audioCtx=null, intervaloAlarme=null, intervaloContagem=null, tempoRestante=180
let limite=parseFloat(localStorage.getItem('alarme_threshold')||'1000')
let alarmesSilenciados=JSON.parse(localStorage.getItem('alarmes_silenciados')||'{}')
let contasDesmarcadas=new Set(JSON.parse(localStorage.getItem('contas_desmarcadas')||'[]'))
document.getElementById('limiteAlarme').value=limite
document.getElementById('limiteInfo').innerText='≥'+Number(limite).toLocaleString('pt-AO')+' KZ'
function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function customConfirm(msg){return new Promise(r=>{const m=document.getElementById('modalConfirm'),t=document.getElementById('modalText'),ok=document.getElementById('modalOk'),ca=document.getElementById('modalCancel');t.innerText=msg;m.style.display='flex';const cl=v=>{m.style.display='none';ok.onclick=null;ca.onclick=null;r(v)};ok.onclick=()=>cl(true);ca.onclick=()=>cl(false)})}
function parseValor(str){if(!str)return 0;let s=String(str).toLowerCase().replace(/kz/g,'').trim().replace(/\s/g,'').replace(/[^0-9.,\-]/g,'');if(!s)return 0;if(s.includes('.')&&s.includes(',')){if(s.lastIndexOf('.')>s.lastIndexOf(','))s=s.replace(/,/g,'');else s=s.replace(/\./g,'').replace(',', '.')}else if(s.includes(',')){let p=s.split(','),u=p[p.length-1];if(u.length<=2)s=p.slice(0,-1).join('')+'.'+u;else s=s.replace(/,/g,'')}else{let p=s.split('.');if(p.length==2&&p[1].length===3)s=p[0]+p[1];else if(p.length>2){let d=p.pop();if(d.length<=2)s=p.join('')+'.'+d;else s=p.join('')+d}}let n=parseFloat(s);return isNaN(n)?0:n}
async function carregar(){const st=document.getElementById('status');st.innerText='● Sincronizando...';const{data,error}=await supabase.from('contatos').select('*');if(error){st.innerText='● Erro';mostrarToast('❌ '+error.message,true);return}if(!data||!data.length){st.innerText='● Vazio';document.getElementById('lista').innerHTML='<tr><td colspan=6 style="text-align:center;color:#64748b;padding:20px">Sem dados</td></tr>';return}data.sort((a,b)=>(b.id||0)-(a.id||0));todosDados=data;dadosFiltrados=data;document.getElementById('totalContas').innerText=data.length;st.innerText='● '+data.length+' contas • '+new Date().toLocaleTimeString('pt-PT');mostrarTabela(dadosFiltrados);verificarAlarme();resetarTimer()}
function mostrarTabela(dados){const lista=document.getElementById('lista');lista.innerHTML='';let countAlto=0;dados.forEach(item=>{const v=parseValor(item.valor);const key=String(item.contacto||'').trim();const des=contasDesmarcadas.has(key)||contasDesmarcadas.has(String(item.id));const alto=v>=limite&&!des;const crit=v>=5000&&!des;if(alto)countAlto++;const dataF=item.created_at?new Date(item.created_at).toLocaleDateString('pt-PT'):'—';let cl='';if(des)cl='desmarcada';else if(crit)cl='saldo-critico';else if(alto)cl='saldo-alto';lista.innerHTML+=`<tr class="${cl}"><td data-label="#">${item.id??'-'}</td><td data-label="Contacto"><b>${escAttr(item.contacto??'-')}</b></td><td data-label="Credencial">${escAttr(item.mensagem??'-')}</td><td data-label="Saldo"><span class="badge-valor">${escAttr(item.valor??'-')}</span></td><td data-label="Data" style="color:#94a3b8;font-size:10px">${dataF}</td><td data-label="Ações"><div class="acoes"><button class="btn-copiar" data-v="${escAttr(item.contacto||'')}" onclick="copiar(this.getAttribute('data-v'))">📋 Copiar</button><button class="btn-copiar" data-v="${escAttr(item.mensagem||'')}" onclick="copiar(this.getAttribute('data-v'))">🔑 Senha</button><button class="btn-eliminar" data-id="${item.id}" onclick="eliminar(parseInt(this.getAttribute('data-id')))">🗑 Eliminar</button></div></td></tr>`});document.getElementById('saldoAltoCount').innerText=countAlto;document.getElementById('mostrando').innerText=dados.length+' contas'}
window.carregar=carregar
window.filtrar=function(){const t=document.getElementById('pesquisa').value.toLowerCase();dadosFiltrados=!t?todosDados:todosDados.filter(i=>(i.contacto||'').toLowerCase().includes(t)||String(i.valor||'').toLowerCase().includes(t)||(i.mensagem||'').toLowerCase().includes(t));mostrarTabela(dadosFiltrados)}
window.copiar=function(tx){navigator.clipboard.writeText(tx);mostrarToast('✓ Copiado : '+tx.substring(0,18))}
window.eliminar=async function(id){if(!id)return;const ok=await customConfirm('Remover conta #'+id+' ?');if(!ok)return;try{const{data,error}=await supabase.from('contatos').delete().eq('id',id).select();if(error){mostrarToast('Erro: '+error.message,true);return}if(!data||!data.length){const{data:check}=await supabase.from('contatos').select('id').eq('id',id);if(check&&check.length>0)mostrarToast('RLS bloqueando DELETE',true);else{mostrarToast('✓ Removida');carregar()}}else{mostrarToast('✓ Removida');carregar()}}catch(e){mostrarToast('Erro: '+(e.message||e),true)}}
window.desmarcarVermelhos=function(){let n=0;todosDados.forEach(i=>{if(parseValor(i.valor)>=limite){const k=String(i.contacto||'').trim();if(!contasDesmarcadas.has(k)){contasDesmarcadas.add(k);n++}}});localStorage.setItem('contas_desmarcadas',JSON.stringify([...contasDesmarcadas]));mostrarTabela(dadosFiltrados);mostrarToast(`✓ ${n} alertas limpos`)}
window.resetDesmarcados=function(){if(!contasDesmarcadas.size){mostrarToast('Nada oculto');return}contasDesmarcadas.clear();localStorage.setItem('contas_desmarcadas',JSON.stringify([]));mostrarTabela(dadosFiltrados);mostrarToast('↩ Restaurado')}
window.setLimite=function(v){limite=parseFloat(v);document.getElementById('limiteAlarme').value=v;localStorage.setItem('alarme_threshold',v);document.getElementById('limiteInfo').innerText='≥'+Number(v).toLocaleString('pt-AO')+' KZ';mostrarTabela(dadosFiltrados);verificarAlarme()}
let deb=null;document.getElementById('limiteAlarme').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{let v=parseFloat(e.target.value)||0;if(v<=0)return;limite=v;localStorage.setItem('alarme_threshold',v);document.getElementById('limiteInfo').innerText='≥'+Number(v).toLocaleString('pt-AO')+' KZ';mostrarTabela(dadosFiltrados);verificarAlarme();mostrarToast('Limite ≥ '+v+' KZ')},500)})
function verificarAlarme(){pararAlarmeSomenteAudio();if(!todosDados.length||limite<=0)return;let max=0,lista=[];todosDados.forEach(i=>{let v=parseValor(i.valor),k=String(i.contacto||'').trim(),sil=alarmesSilenciados.hasOwnProperty(k),mud=false;if(sil&&v>alarmesSilenciados[k]+0.01)mud=true;if(v>=limite){if(v>max)max=v;if(!sil||mud)lista.push({v,mud})}});const b=document.getElementById('bannerAlarme');if(!lista.length){b.style.display='none';return}if(max>=5000){tocarAlarmeCritico();b.innerHTML='⚠ CRÍTICO: '+max.toLocaleString('pt-AO')+' KZ';b.style.display='block'}else{tocarAlarmeNormal();b.innerHTML='● '+lista.length+' contas ≥ '+limite.toLocaleString('pt-AO')+' KZ • máx '+max.toLocaleString('pt-AO')+' KZ';b.style.display='block'}}
function pararAlarmeSomenteAudio(){alarmeAtivo=false;if(intervaloAlarme)clearInterval(intervaloAlarme);if(audioCtx)try{audioCtx.close()}catch(e){}}
function tocarAlarmeNormal(){if(alarmeAtivo)return;alarmeAtivo=true;document.getElementById('btnParar').style.display='inline-flex';audioCtx=new (window.AudioContext||window.webkitAudioContext)();function beep(f,d){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.22,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+d/1000)}intervaloAlarme=setInterval(()=>{beep(800,160);setTimeout(()=>beep(500,160),240)},1000)}
function tocarAlarmeCritico(){if(alarmeAtivo)return;alarmeAtivo=true;document.getElementById('btnParar').style.display='inline-flex';audioCtx=new (window.AudioContext||window.webkitAudioContext)();function beep(f,d,v=0.3){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+d/1000)}intervaloAlarme=setInterval(()=>{beep(1100,100,0.35);setTimeout(()=>beep(320,100,0.35),120);setTimeout(()=>beep(1100,100,0.35),240)},600)}
window.pararAlarme=function(){let n=0;todosDados.forEach(i=>{if(parseValor(i.valor)>=limite){alarmesSilenciados[String(i.contacto||'').trim()]=parseValor(i.valor);n++}});localStorage.setItem('alarmes_silenciados',JSON.stringify(alarmesSilenciados));alarmeAtivo=false;if(intervaloAlarme)clearInterval(intervaloAlarme);if(audioCtx)try{audioCtx.close()}catch(e){};document.getElementById('btnParar').style.display='none';document.getElementById('bannerAlarme').style.display='none';mostrarToast(`🔇 ${n} silenciados`)}
function resetarTimer(){tempoRestante=180;atualizarTimerDisplay()}
function atualizarTimerDisplay(){const m=String(Math.floor(tempoRestante/60)).padStart(2,'0'),s=String(tempoRestante%60).padStart(2,'0');document.getElementById('timer').innerText=m+':'+s}
intervaloContagem=setInterval(()=>{if(!document.getElementById('autoToggle').checked)return;tempoRestante--;if(tempoRestante<=0){carregar();tempoRestante=180}atualizarTimerDisplay()},1000)
function mostrarToast(msg,err=false){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';t.style.background=err?'#7f1d1d':'#0f172a';t.style.borderColor=err?'#ef4444':'#1e293b';setTimeout(()=>t.style.display='none',3000)}
carregar()
</script>
